<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Agent Silhouettes -->
  <g transform="translate(400, 240)" filter="url(#shadow)">
    <!-- Red Agent -->
    <rect x="-160" y="-120" width="140" height="200" rx="16" fill="#dc2626" stroke="#fca5a5" stroke-width="4"/>
    <text x="-90" y="-20" font-family="sans-serif" font-size="60" text-anchor="middle" fill="#ffffff">🕵️‍♂️</text>
    <text x="-90" y="40" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">RED AGENT</text>

    <!-- Blue Agent -->
    <rect x="20" y="-120" width="140" height="200" rx="16" fill="#2563eb" stroke="#93c5fd" stroke-width="4"/>
    <text x="90" y="-20" font-family="sans-serif" font-size="60" text-anchor="middle" fill="#ffffff">🕵️‍♀️</text>
    <text x="90" y="40" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">BLUE AGENT</text>
  </g>

  <!-- Title Overlay -->
  <rect x="0" y="490" width="800" height="110" fill="rgba(15, 23, 42, 0.88)"/>
  <text x="400" y="540" font-family="Tahoma, sans-serif" font-size="32" font-weight="bold" fill="#fef08a" text-anchor="middle">بازی فکری کدنیمز (Codenames)</text>
  <text x="400" y="575" font-family="sans-serif" font-size="18" fill="#cbd5e1" text-anchor="middle">رقابت جاسوسی، ارتباط کلمات و ذهن‌خوانی تیمی</text>
</svg>