<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Speed Cups Stack -->
  <g transform="translate(400, 230)" filter="url(#shadow)">
    <!-- Blue Cup -->
    <path d="M-120 100 L-100 0 L-60 0 L-40 100 Z" fill="#2563eb" stroke="#93c5fd" stroke-width="3"/>
    <!-- Red Cup -->
    <path d="M-60 100 L-40 0 L0 0 L20 100 Z" fill="#dc2626" stroke="#fca5a5" stroke-width="3"/>
    <!-- Green Cup -->
    <path d="M0 100 L20 0 L60 0 L80 100 Z" fill="#16a34a" stroke="#86efac" stroke-width="3"/>
    <!-- Yellow Cup -->
    <path d="M60 100 L80 0 L120 0 L140 100 Z" fill="#ca8a04" stroke="#fef08a" stroke-width="3"/>
    
    <!-- Central Ringing Bell -->
    <circle cx="0" cy="-60" r="45" fill="#f59e0b" stroke="#fef08a" stroke-width="4"/>
    <rect x="-15" y="-110" width="30" height="20" rx="4" fill="#d97706"/>
    <text x="0" y="-48" font-family="sans-serif" font-size="32" text-anchor="middle">🔔</text>
  </g>

  <!-- Title Overlay -->
  <rect x="0" y="490" width="800" height="110" fill="rgba(15, 23, 42, 0.88)"/>
  <text x="400" y="540" font-family="Tahoma, sans-serif" font-size="32" font-weight="bold" fill="#fef08a" text-anchor="middle">بازی کاپچین (Speed Cups)</text>
  <text x="400" y="575" font-family="sans-serif" font-size="18" fill="#93c5fd" text-anchor="middle">نشر هوپا - چالش سرعت عمل، تمرکز دیداری و زنگ سرعت</text>
</svg>