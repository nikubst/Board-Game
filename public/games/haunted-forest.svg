<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Eerie Glowing Mushrooms & Trees -->
  <g opacity="0.7">
    <path d="M100 450 L120 200 L140 450 Z" fill="#064e3b"/>
    <path d="M660 450 L680 180 L700 450 Z" fill="#064e3b"/>
  </g>

  <g filter="url(#glow)" transform="translate(400, 260)">
    <!-- Magical glowing mushroom -->
    <path d="M-40 100 Q0 80 40 100 L20 180 L-20 180 Z" fill="#a7f3d0"/>
    <path d="M-80 100 Q0 -20 80 100 Z" fill="#10b981"/>
    <circle cx="-30" cy="50" r="10" fill="#ec4899"/>
    <circle cx="25" cy="40" r="12" fill="#fef08a"/>
  </g>

  <!-- Title Overlay -->
  <rect x="0" y="490" width="800" height="110" fill="rgba(15, 23, 42, 0.88)"/>
  <text x="400" y="540" font-family="Tahoma, sans-serif" font-size="32" font-weight="bold" fill="#a7f3d0" text-anchor="middle">جنگل سوخته (Haunted Forest)</text>
  <text x="400" y="575" font-family="sans-serif" font-size="18" fill="#6ee7b7" text-anchor="middle">بازی فکری ماجراجویی، بقا و اسرار جنگل طلسم‌شده</text>
</svg>