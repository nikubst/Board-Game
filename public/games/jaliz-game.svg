<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Farm Vegetables Illustrations -->
  <g transform="translate(400, 240)" filter="url(#shadow)">
    <!-- Tomato -->
    <circle cx="-140" cy="0" r="55" fill="#ef4444" stroke="#fca5a5" stroke-width="4"/>
    <path d="M-140 -55 C-150 -70 -130 -70 -140 -55" fill="#15803d"/>
    <text x="-140" y="15" font-family="sans-serif" font-size="44" text-anchor="middle">🍅</text>

    <!-- Watermelon -->
    <circle cx="0" cy="-40" r="60" fill="#16a34a" stroke="#86efac" stroke-width="4"/>
    <text x="0" y="-20" font-family="sans-serif" font-size="50" text-anchor="middle">🍉</text>

    <!-- Carrot -->
    <circle cx="140" cy="0" r="55" fill="#f97316" stroke="#fed7aa" stroke-width="4"/>
    <text x="140" y="15" font-family="sans-serif" font-size="44" text-anchor="middle">🥕</text>
  </g>

  <!-- Title Overlay -->
  <rect x="0" y="490" width="800" height="110" fill="rgba(15, 23, 42, 0.88)"/>
  <text x="400" y="540" font-family="Tahoma, sans-serif" font-size="32" font-weight="bold" fill="#fef08a" text-anchor="middle">بازی فکری جالیز (Jaliz / Hoopa)</text>
  <text x="400" y="575" font-family="sans-serif" font-size="18" fill="#bbf7d0" text-anchor="middle">نشر هوپا - رقابت جذاب کشاورزی، کاشت صیفی‌جات و تجارت</text>
</svg>