<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="50%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Royal Daggers & Crown -->
  <g filter="url(#shadow)" transform="translate(400, 240)">
    <!-- Crown -->
    <path d="M-60 -80 L-90 -10 L-30 -30 L0 -90 L30 -30 L90 -10 L60 -80 L30 -60 L0 -100 L-30 -60 Z" fill="#f59e0b" stroke="#fef08a" stroke-width="3"/>
    
    <!-- Crossed Daggers -->
    <path d="M-120 60 L120 -60" stroke="#d4d4d8" stroke-width="12" stroke-linecap="round"/>
    <path d="M120 60 L-120 -60" stroke="#d4d4d8" stroke-width="12" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="30" fill="#dc2626" stroke="#f59e0b" stroke-width="4"/>
  </g>

  <!-- Gold Coins -->
  <g filter="url(#shadow)">
    <circle cx="260" cy="380" r="30" fill="#eab308" stroke="#fef08a" stroke-width="4"/>
    <circle cx="310" cy="400" r="30" fill="#ca8a04" stroke="#fef08a" stroke-width="4"/>
    <circle cx="500" cy="390" r="30" fill="#eab308" stroke="#fef08a" stroke-width="4"/>
  </g>

  <!-- Title Overlay -->
  <rect x="0" y="490" width="800" height="110" fill="rgba(15, 23, 42, 0.88)"/>
  <text x="400" y="540" font-family="Tahoma, sans-serif" font-size="32" font-weight="bold" fill="#fef08a" text-anchor="middle">بازی فکری کودتا (Coup)</text>
  <text x="400" y="575" font-family="sans-serif" font-size="18" fill="#fca5a5" text-anchor="middle">بازی بلوف‌زنی، قدرت و هوش استراتژیک</text>
</svg>