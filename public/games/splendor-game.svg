<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Renaissance Gem Chips -->
  <g transform="translate(400, 240)" filter="url(#glow)">
    <!-- Ruby -->
    <circle cx="-160" cy="0" r="45" fill="#dc2626" stroke="#fca5a5" stroke-width="4"/>
    <polygon points="-160,-25 -140,0 -160,25 -180,0" fill="#f87171"/>

    <!-- Sapphire -->
    <circle cx="-50" cy="-60" r="45" fill="#2563eb" stroke="#93c5fd" stroke-width="4"/>
    <polygon points="-50,-85 -30,-60 -50,-35 -70,-60" fill="#60a5fa"/>

    <!-- Emerald -->
    <circle cx="60" cy="-60" r="45" fill="#059669" stroke="#6ee7b7" stroke-width="4"/>
    <polygon points="60,-85 80,-60 60,-35 40,-60" fill="#34d399"/>

    <!-- Diamond -->
    <circle cx="170" cy="0" r="45" fill="#e2e8f0" stroke="#ffffff" stroke-width="4"/>
    <polygon points="170,-25 190,0 170,25 150,0" fill="#ffffff"/>

    <!-- Gold -->
    <circle cx="50" cy="70" r="48" fill="#eab308" stroke="#fef08a" stroke-width="5"/>
    <text x="50" y="82" font-family="sans-serif" font-size="32" font-weight="bold" fill="#713f12" text-anchor="middle">★</text>
  </g>

  <!-- Title Overlay -->
  <rect x="0" y="490" width="800" height="110" fill="rgba(15, 23, 42, 0.88)"/>
  <text x="400" y="540" font-family="Tahoma, sans-serif" font-size="32" font-weight="bold" fill="#fef08a" text-anchor="middle">بازی فکری اسپلندور (Splendor)</text>
  <text x="400" y="575" font-family="sans-serif" font-size="18" fill="#ddd6fe" text-anchor="middle">تجارت جواهرات و مدیریت منابع رنسانس</text>
</svg>