<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Catan Hexagon Tiles Grid -->
  <g transform="translate(400, 240)" filter="url(#shadow)">
    <!-- Hex 1 Wheat -->
    <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" fill="#eab308" stroke="#fef08a" stroke-width="4"/>
    <text x="0" y="10" font-family="sans-serif" font-size="28" font-weight="bold" fill="#713f12" text-anchor="middle">🌾 8</text>

    <!-- Hex 2 Forest -->
    <polygon points="-120,-10  -51,-50 -51,30 -120,70 -189,30 -189,-50" fill="#15803d" stroke="#86efac" stroke-width="4"/>
    <text x="-120" y="20" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">🌲 5</text>

    <!-- Hex 3 Mountains -->
    <polygon points="120,-10 189,-50 189,30 120,70 51,30 51,-50" fill="#64748b" stroke="#cbd5e1" stroke-width="4"/>
    <text x="120" y="20" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">🏔️ 10</text>
  </g>

  <!-- Title Overlay -->
  <rect x="0" y="490" width="800" height="110" fill="rgba(15, 23, 42, 0.88)"/>
  <text x="400" y="540" font-family="Tahoma, sans-serif" font-size="32" font-weight="bold" fill="#fef08a" text-anchor="middle">بازی فکری کاتان (Catan)</text>
  <text x="400" y="575" font-family="sans-serif" font-size="18" fill="#bae6fd" text-anchor="middle">محبوب‌ترین بازی استراتژی، دادوستد و توسعه در جهان</text>
</svg>