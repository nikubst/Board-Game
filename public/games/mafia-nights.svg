<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#spotlight)"/>

  <!-- Mafia Hat, Badge & Mask -->
  <g transform="translate(400, 230)" filter="url(#shadow)">
    <!-- Top Hat -->
    <path d="M-80 0 L80 0 L60 -80 L-60 -80 Z" fill="#27272a"/>
    <rect x="-110" y="0" width="220" height="20" rx="6" fill="#18181b"/>
    <rect x="-60" y="-15" width="120" height="15" fill="#dc2626"/>

    <!-- Detective Badge -->
    <polygon points="0,50 40,80 30,130 0,160 -30,130 -40,80" fill="#f59e0b" stroke="#fef08a" stroke-width="3"/>
    <text x="0" y="115" font-family="sans-serif" font-size="28" text-anchor="middle">🔍</text>
  </g>

  <!-- Title Overlay -->
  <rect x="0" y="490" width="800" height="110" fill="rgba(9, 9, 11, 0.9)"/>
  <text x="400" y="540" font-family="Tahoma, sans-serif" font-size="32" font-weight="bold" fill="#fef08a" text-anchor="middle">بازی شب‌های مافیا (Nights of Mafia)</text>
  <text x="400" y="575" font-family="sans-serif" font-size="18" fill="#fca5a5" text-anchor="middle">محبوب‌ترین بازی استنتاج، نقش مخفی و روانشناسی اجتماعی</text>
</svg>