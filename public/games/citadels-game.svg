<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Citadel Castle Towers & Crown -->
  <g transform="translate(400, 240)" filter="url(#shadow)">
    <!-- Castle Fortress -->
    <path d="M-150 140 L-150 -20 L-110 -20 L-110 10 L-80 10 L-80 -20 L-50 -20 L-50 140 Z" fill="#475569"/>
    <path d="M50 140 L50 -20 L80 -20 L80 10 L110 10 L110 -20 L150 -20 L150 140 Z" fill="#475569"/>
    <rect x="-60" y="-60" width="120" height="200" fill="#334155"/>
    <path d="M-60 -60 L0 -130 L60 -60 Z" fill="#dc2626"/>

    <!-- Gold Crown -->
    <path d="M-40 -120 L-60 -60 L-20 -75 L0 -130 L20 -75 L60 -60 L40 -120 Z" fill="#f59e0b" stroke="#fef08a" stroke-width="3"/>
  </g>

  <!-- Title Overlay -->
  <rect x="0" y="490" width="800" height="110" fill="rgba(15, 23, 42, 0.88)"/>
  <text x="400" y="540" font-family="Tahoma, sans-serif" font-size="32" font-weight="bold" fill="#fef08a" text-anchor="middle">بازی فکری دژ (Citadels / Hoopa)</text>
  <text x="400" y="575" font-family="sans-serif" font-size="18" fill="#c7d2fe" text-anchor="middle">نشر هوپا - رقابت شهرسازی قرون‌وسطایی، نقش‌ها و پادشاهی</text>
</svg>