<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Vintage Train Steam Locomotive Illustration -->
  <g transform="translate(400, 230)" filter="url(#shadow)">
    <!-- Steam -->
    <circle cx="-140" cy="-110" r="30" fill="#f3f4f6" opacity="0.4"/>
    <circle cx="-90" cy="-140" r="45" fill="#f3f4f6" opacity="0.6"/>

    <!-- Locomotive Train Body -->
    <rect x="-160" y="-70" width="280" height="110" fill="#1e293b" rx="10"/>
    <rect x="20" y="-120" width="100" height="160" fill="#0f172a" rx="10"/>
    <!-- Chimney -->
    <rect x="-140" y="-110" width="35" height="40" fill="#dc2626"/>

    <!-- Wheels -->
    <circle cx="-120" cy="50" r="35" fill="#ca8a04" stroke="#fef08a" stroke-width="4"/>
    <circle cx="-40" cy="50" r="35" fill="#ca8a04" stroke="#fef08a" stroke-width="4"/>
    <circle cx="40" cy="50" r="35" fill="#ca8a04" stroke="#fef08a" stroke-width="4"/>
  </g>

  <!-- Title Overlay -->
  <rect x="0" y="490" width="800" height="110" fill="rgba(15, 23, 42, 0.88)"/>
  <text x="400" y="540" font-family="Tahoma, sans-serif" font-size="32" font-weight="bold" fill="#fef08a" text-anchor="middle">بازی فکری بلیت سفر (Ticket to Ride)</text>
  <text x="400" y="575" font-family="sans-serif" font-size="18" fill="#fde68a" text-anchor="middle">شاهکار بین‌المللی احداث خطوط راه‌آهن و استراتژی شبکه‌ای</text>
</svg>