<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Court Cards -->
  <g transform="translate(400, 240)" filter="url(#shadow)">
    <!-- King Card -->
    <rect x="-140" y="-120" width="120" height="190" rx="12" fill="#fef08a" stroke="#ca8a04" stroke-width="4"/>
    <text x="-80" y="-20" font-family="Tahoma" font-size="48" text-anchor="middle" fill="#854d0e">👑</text>
    <text x="-80" y="30" font-family="Tahoma" font-size="20" font-weight="bold" text-anchor="middle" fill="#854d0e">شاه</text>

    <!-- Minister Card -->
    <rect x="-20" y="-140" width="130" height="200" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="4"/>
    <text x="45" y="-35" font-family="Tahoma" font-size="48" text-anchor="middle" fill="#0369a1">📜</text>
    <text x="45" y="15" font-family="Tahoma" font-size="20" font-weight="bold" text-anchor="middle" fill="#0369a1">وزیر</text>

    <!-- Thief Card -->
    <rect x="100" y="-110" width="120" height="190" rx="12" fill="#fecdd3" stroke="#e11d48" stroke-width="4"/>
    <text x="160" y="-10" font-family="Tahoma" font-size="48" text-anchor="middle" fill="#9f1239">🗡️</text>
    <text x="160" y="40" font-family="Tahoma" font-size="20" font-weight="bold" text-anchor="middle" fill="#9f1239">دزد</text>
  </g>

  <!-- Title Overlay -->
  <rect x="0" y="490" width="800" height="110" fill="rgba(15, 23, 42, 0.88)"/>
  <text x="400" y="540" font-family="Tahoma, sans-serif" font-size="32" font-weight="bold" fill="#fef08a" text-anchor="middle">بازی شاه، دزد، وزیر</text>
  <text x="400" y="575" font-family="sans-serif" font-size="18" fill="#a7f3d0" text-anchor="middle">بازی فکری دورهمی اصیل و نوستالژیک ایرانی</text>
</svg>