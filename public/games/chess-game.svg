<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Chess Board Pattern -->
  <g opacity="0.25">
    <rect x="200" y="40" width="400" height="400" fill="#e2e8f0"/>
    <!-- Alternating tiles -->
    <rect x="200" y="40" width="50" height="50" fill="#334155"/><rect x="300" y="40" width="50" height="50" fill="#334155"/><rect x="400" y="40" width="50" height="50" fill="#334155"/><rect x="500" y="40" width="50" height="50" fill="#334155"/>
    <rect x="250" y="90" width="50" height="50" fill="#334155"/><rect x="350" y="90" width="50" height="50" fill="#334155"/><rect x="450" y="90" width="50" height="50" fill="#334155"/><rect x="550" y="90" width="50" height="50" fill="#334155"/>
  </g>

  <!-- Golden Knight & King Silhouette -->
  <g filter="url(#shadow)" transform="translate(400, 240)">
    <!-- King -->
    <path d="M-80 120 L-20 120 L-30 60 L-10 40 L-10 10 L-25 10 L-25 -10 L-10 -10 L-10 -30 L10 -30 L10 -10 L25 -10 L25 10 L10 10 L10 40 L30 60 L20 120 L80 120 Z" fill="#f59e0b" stroke="#fef08a" stroke-width="3"/>
    <!-- Knight -->
    <path d="M-150 120 L-90 120 L-90 60 L-120 20 L-150 40 L-160 10 L-110 -20 L-70 10 L-80 60 L-90 120 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  </g>

  <!-- Title Overlay -->
  <rect x="0" y="490" width="800" height="110" fill="rgba(15, 23, 42, 0.88)"/>
  <text x="400" y="540" font-family="Tahoma, sans-serif" font-size="32" font-weight="bold" fill="#fef08a" text-anchor="middle">بازی فکری شطرنج (Chess)</text>
  <text x="400" y="575" font-family="sans-serif" font-size="18" fill="#cbd5e1" text-anchor="middle">شاهکار جهانی تفکر استراتژیک و پیش‌بینی حرکت‌ها</text>
</svg>