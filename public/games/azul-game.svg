<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Portuguese Ceramic Tiles Mosaic Grid -->
  <g transform="translate(400, 240)" filter="url(#shadow)">
    <!-- Blue Tile -->
    <rect x="-140" y="-120" width="120" height="120" rx="10" fill="#0284c7" stroke="#ffffff" stroke-width="4"/>
    <circle cx="-80" cy="-60" r="30" fill="none" stroke="#e0f2fe" stroke-width="4"/>

    <!-- Yellow Tile -->
    <rect x="20" y="-120" width="120" height="120" rx="10" fill="#eab308" stroke="#ffffff" stroke-width="4"/>
    <polygon points="80,-110 130,-60 80,-10 30,-60" fill="#fef08a"/>

    <!-- Red Pattern Tile -->
    <rect x="-140" y="20" width="120" height="120" rx="10" fill="#dc2626" stroke="#ffffff" stroke-width="4"/>
    <circle cx="-80" cy="80" r="30" fill="#fca5a5"/>

    <!-- Black Tile -->
    <rect x="20" y="20" width="120" height="120" rx="10" fill="#18181b" stroke="#ffffff" stroke-width="4"/>
    <polygon points="80,30 130,80 80,130 30,80" fill="#0284c7"/>
  </g>

  <!-- Title Overlay -->
  <rect x="0" y="490" width="800" height="110" fill="rgba(15, 23, 42, 0.88)"/>
  <text x="400" y="540" font-family="Tahoma, sans-serif" font-size="32" font-weight="bold" fill="#fef08a" text-anchor="middle">بازی فکری آزول (Azul)</text>
  <text x="400" y="575" font-family="sans-serif" font-size="18" fill="#bae6fd" text-anchor="middle">هنر کاشی‌کاری پرتغالی، الگوسازی و زیبایی‌شناسی رومیزی</text>
</svg>