<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Dreamy Stars & Moon -->
  <circle cx="650" cy="120" r="45" fill="#fef08a" opacity="0.8" filter="url(#shadow)"/>
  <circle cx="670" cy="110" r="45" fill="#1e1b4b"/>
  <circle cx="150" cy="100" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="280" cy="160" r="4" fill="#ffffff" opacity="0.9"/>
  <circle cx="500" cy="90" r="3" fill="#ffffff" opacity="0.7"/>

  <!-- Surreal Cards floating -->
  <g transform="translate(240, 180) rotate(-15)" filter="url(#shadow)">
    <rect width="160" height="240" rx="16" fill="#ec4899" stroke="#fbcfe8" stroke-width="4"/>
    <circle cx="80" cy="100" r="40" fill="#f472b6"/>
    <path d="M80 60 L100 120 L60 120 Z" fill="#fef08a"/>
  </g>
  
  <g transform="translate(400, 150) rotate(12)" filter="url(#shadow)">
    <rect width="170" height="250" rx="16" fill="url(#card)" stroke="#fef08a" stroke-width="4"/>
    <!-- Floating island artwork -->
    <path d="M40 160 Q85 120 130 160 Q85 190 40 160 Z" fill="#047857"/>
    <circle cx="85" cy="90" r="25" fill="#ec4899"/>
    <path d="M85 65 L95 115 L75 115 Z" fill="#fef08a"/>
  </g>
  
  <!-- Title Overlay -->
  <rect x="0" y="490" width="800" height="110" fill="rgba(15, 23, 42, 0.85)"/>
  <text x="400" y="540" font-family="Tahoma, sans-serif" font-size="32" font-weight="bold" fill="#fef08a" text-anchor="middle">استوژیت (Stojoit / Dixit)</text>
  <text x="400" y="575" font-family="sans-serif" font-size="18" fill="#cbd5e1" text-anchor="middle">نشر هوپا - بازی خلاقیت، تصویرسازی و رویاپردازی</text>
</svg>