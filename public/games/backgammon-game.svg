<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Backgammon Board Frame -->
  <rect x="80" y="60" width="640" height="380" rx="20" fill="#78350f" stroke="#f59e0b" stroke-width="8" filter="url(#shadow)"/>
  <rect x="100" y="80" width="600" height="340" fill="#fef3c7"/>
  <rect x="385" y="80" width="30" height="340" fill="#78350f"/>

  <!-- Triangular Points -->
  <g fill="#b45309">
    <polygon points="110,80 140,80 125,230"/>
    <polygon points="170,80 200,80 185,230"/>
    <polygon points="230,80 260,80 245,230"/>
    <polygon points="430,80 460,80 445,230"/>
    <polygon points="490,80 520,80 505,230"/>
  </g>
  <g fill="#451a03">
    <polygon points="140,80 170,80 155,230"/>
    <polygon points="200,80 230,80 215,230"/>
    <polygon points="460,80 490,80 475,230"/>
  </g>

  <!-- Checkers -->
  <circle cx="125" cy="100" r="18" fill="#18181b" stroke="#52525b" stroke-width="2"/>
  <circle cx="125" cy="136" r="18" fill="#18181b" stroke="#52525b" stroke-width="2"/>
  <circle cx="445" cy="100" r="18" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
  <circle cx="445" cy="136" r="18" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>

  <!-- Title Overlay -->
  <rect x="0" y="490" width="800" height="110" fill="rgba(15, 23, 42, 0.88)"/>
  <text x="400" y="540" font-family="Tahoma, sans-serif" font-size="32" font-weight="bold" fill="#fef08a" text-anchor="middle">بازی تخته نرد (Backgammon)</text>
  <text x="400" y="575" font-family="sans-serif" font-size="18" fill="#fde68a" text-anchor="middle">اصیل‌ترین و کهن‌ترین بازی فکری تاکتیکی و احتمالات</text>
</svg>