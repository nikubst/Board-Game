<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="50%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Antique Treasure Chest & Gold -->
  <g transform="translate(400, 240)" filter="url(#shadow)">
    <!-- Treasure Chest Base -->
    <rect x="-120" y="0" width="240" height="120" rx="16" fill="#78350f" stroke="#f59e0b" stroke-width="4"/>
    <!-- Lid Lid open -->
    <path d="M-130 -20 Q0 -90 130 -20 L120 0 L-120 0 Z" fill="#b45309" stroke="#fef08a" stroke-width="4"/>
    
    <!-- Glowing Gold Coins & Treasures -->
    <circle cx="-50" cy="-10" r="20" fill="#eab308"/>
    <circle cx="0" cy="-25" r="25" fill="#f59e0b"/>
    <circle cx="50" cy="-10" r="20" fill="#eab308"/>
    <text x="0" y="-15" font-family="sans-serif" font-size="28" text-anchor="middle">👑</text>
  </g>

  <!-- Title Overlay -->
  <rect x="0" y="490" width="800" height="110" fill="rgba(15, 23, 42, 0.88)"/>
  <text x="400" y="540" font-family="Tahoma, sans-serif" font-size="32" font-weight="bold" fill="#fef08a" text-anchor="middle">بازی زیرخاکی (Zirkhaki)</text>
  <text x="400" y="575" font-family="sans-serif" font-size="18" fill="#e4e4e7" text-anchor="middle">نشر رومیز - هیجان عتیقه‌یابی، ریسک‌پذیری و شانس‌کاری</text>
</svg>