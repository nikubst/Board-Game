<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Ancient Pyramid & Wonders Illustration -->
  <g transform="translate(400, 240)" filter="url(#shadow)">
    <!-- Great Pyramid -->
    <polygon points="0,-120 160,100 -160,100" fill="#d97706" stroke="#fef08a" stroke-width="4"/>
    <polygon points="0,-120 160,100 0,100" fill="#b45309"/>

    <!-- Glowing Sun Disc -->
    <circle cx="0" cy="-120" r="25" fill="#fef08a"/>
  </g>

  <!-- Title Overlay -->
  <rect x="0" y="490" width="800" height="110" fill="rgba(15, 23, 42, 0.88)"/>
  <text x="400" y="540" font-family="Tahoma, sans-serif" font-size="32" font-weight="bold" fill="#fef08a" text-anchor="middle">عجایب هفتگانه (7 Wonders)</text>
  <text x="400" y="575" font-family="sans-serif" font-size="18" fill="#c7d2fe" text-anchor="middle">شاهکار تمدن‌سازی، دست‌به‌دست کردن کارت‌ها و ساخت عجایب جهان</text>
</svg>